[package]
name = "tool-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Tool trait, schema, registry, permission evaluator and primitive implementations"

[dependencies]
agent-core = { path = "../agent-core" }
agent-protocol = { path = "../agent-protocol" }
thiserror = { version = "2.0", default-features = false }
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1", features = ["serde", "v4"], default-features = false }
schemars = { version = "1.2", features = ["derive"] }
semver = { version = "1.0", features = ["serde"] }
async-trait = "0.1"
futures-core = "0.3"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3.8"
