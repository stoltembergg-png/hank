[package]
name = "hank-desktop"
version = "1.0.0"
edition = "2021"

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-notification = "2.3.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
agent-protocol = { path = "../../../crates/agent-protocol" }
agent-core = { path = "../../../crates/agent-core" }
agent-runtime = { path = "../../../crates/agent-runtime" }
auth-core = { path = "../../../crates/auth-core" }
provider-core = { path = "../../../crates/provider-core" }
provider-adapter-openai = { path = "../../../crates/provider-adapters/openai" }
secrets-core = { path = "../../../crates/secrets-core" }
tool-core = { path = "../../../crates/tool-core" }
workflow-core = { path = "../../../crates/workflow-core" }
uuid = { version = "1.0", features = ["v4"] }
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.10"
ring = "0.17"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security_Credentials"] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[workspace]
