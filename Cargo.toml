[workspace]
resolver = "2"
members = [
    "crates/agent-core",
    "crates/agent-runtime",
    "crates/agent-protocol",
    "crates/plugin-core",
    "crates/provider-core",
    "crates/secrets-core",
    "crates/security-core",
    "crates/auth-core",
    "crates/remote-core",
    "crates/remote-adapter",
    "crates/provider-adapters/openai-compatible",
    "crates/provider-adapters/openai",
    "crates/provider-adapters/anthropic",
    "crates/provider-adapters/gemini",
    "crates/provider-adapters/openrouter",
    "crates/provider-adapters/ollama",
    "crates/tool-core",
    "crates/test-support",
    "crates/workflow-core",
    "crates/xtask",
    "crates/recovery-core",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Gabriel <stoltembergg-png@users.noreply.github.com>"]
repository = "https://github.com/stoltembergg-png/hank"
description = "Plataforma desktop multiagente — core Rust modular + Tauri 2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono", "migrate"] }
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
cargo_metadata = "0.23"
semver = { version = "1.0", features = ["serde"] }
futures-core = "0.3"
futures-util = "0.3"
tempfile = "3.8"
getrandom = "0.4"
syn = "3"
rand = "0.10"
sha2 = "0.11"
subtle = "2.6"
zeroize = "1.9"

# [workspace.lints]  # Disabled due to format issues; add back when Rust version supports it
# rust_2018_idioms = "warn"
# unused_crate_dependencies = "warn"
# unused_import_braces = "warn"
# unused_lifetimes = "warn"
# unused_qualifications = "warn"
# variant_size_differences = "warn"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
