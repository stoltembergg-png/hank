name: Security advisory gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-advisory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-advisories:
    name: Security advisory gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Run cargo-audit for every Rust lockfile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security/reports
          set +e
          cargo audit --json --file Cargo.lock > security/reports/root.json 2> security/reports/root.stderr
          root_status=$?
          cargo audit --json --file apps/desktop/src-tauri/Cargo.lock > security/reports/tauri.json 2> security/reports/tauri.stderr
          tauri_status=$?
          set -e
          cargo tree --locked --prefix none --format '{p}' > security/reports/root.tree
          cargo tree --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --prefix none --format '{p}' > security/reports/tauri.tree
          printf '%s\n' "$root_status" > security/reports/root.json.exit
          printf '%s\n' "$tauri_status" > security/reports/tauri.json.exit

      - name: Classify advisories fail-closed
        run: node tools/security/check-rust-advisories.mjs security/advisory-baseline.json security/reports/root.json::security/reports/root.tree security/reports/tauri.json::security/reports/tauri.tree

      - name: Upload raw cargo-audit reports
        if: always()
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-security-audit-${{ github.sha }}
          path: security/reports/
          if-no-files-found: error
          retention-days: 14

      - name: Require audit artifact digest
        if: always()
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: tools/ci/require-artifact-digest.sh
