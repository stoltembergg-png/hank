name: Quality integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Quality integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          expected_tree="$(git ls-tree "$EXPECTED_SHA")"
          actual_tree="$(git ls-tree HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          test "$actual_tree" = "$expected_tree"

      - name: Run Actionlint
        run: bash tools/ci/run-actionlint.sh

      - name: Validate workflow integrity
        run: node --test tools/workflow-integrity.spec.mjs

      - name: Validate reviewer remediation contracts
        run: node --test tools/review-remediation-workflow.spec.mjs tools/review-remediation/*.spec.mjs

      - name: Validate automated reviewer policy
        run: node --test tools/reviewer-policy-check.spec.mjs

      - name: Validate Dependabot configuration
        run: node --test tools/dependabot-config.spec.mjs

      - name: Validate security advisory baseline
        run: node --test tools/security-advisory-baseline.spec.mjs

      - name: Validate Tauri ONP reporter contract
        run: node --test tools/tauri-desktop-onp-contract.spec.mjs

      - name: Validate architecture documentation
        run: node --test tools/architecture-docs.spec.mjs

      - name: Validate ADR structure
        run: node --test tools/adr-lint.spec.mjs && node tools/adr-lint.mjs

      - name: Validate quality gate contract
        run: node --test tools/quality-gate-contract.spec.mjs
