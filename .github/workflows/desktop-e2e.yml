name: Desktop E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      negative_mutation:
        description: Run the uncommitted missing-create_project mutation proof
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  project-lifecycle:
    name: Project Lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          timeout 180s sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          timeout 300s sudo apt-get -o Acquire::ForceIPv4=true -o DPkg::Lock::Timeout=60 -o Dpkg::Use-Pty=0 install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev webkit2gtk-driver xvfb curl build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          pkg-config --modversion javascriptcoregtk-4.1
          pkg-config --modversion webkit2gtk-4.1

      - name: Setup pinned Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20.19.1
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop-e2e/package-lock.json

      - name: Setup pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Install pinned tauri-driver
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Install frontend dependencies
        run: npm ci --no-fund
        working-directory: frontend

      - name: Install desktop E2E dependencies
        run: npm ci --no-fund
        working-directory: desktop-e2e

      - name: Build frontend production bundle
        run: npm run build
        working-directory: frontend

      - name: Build real Tauri application
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - name: Run real Project lifecycle on Linux
        if: runner.os == 'Linux'
        env:
          HANK_DESKTOP_E2E_ARTIFACTS: ${{ runner.temp }}/hank-desktop-e2e-artifacts
          HANK_DESKTOP_BIN: ${{ github.workspace }}/apps/desktop/src-tauri/target/debug/hank-desktop
          HANK_E2E_APP_DATA_DIR: ${{ runner.temp }}/hank-e2e-app-data
          HANK_WEBDRIVER_PORT: 4444
          RUST_LOG: info
        run: |
          set -euo pipefail
          mkdir -p "$HANK_DESKTOP_E2E_ARTIFACTS" "$HANK_E2E_APP_DATA_DIR"
          set +e
          xvfb-run -a --server-args='-screen 0 1280x1024x24' bash desktop-e2e/run-linux.sh
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            if [[ -d "$HANK_E2E_APP_DATA_DIR" ]]; then
              cp -R "$HANK_E2E_APP_DATA_DIR" "$HANK_DESKTOP_E2E_ARTIFACTS/app-data"
            fi
            exit "$status"
          fi
          rm -rf "$HANK_E2E_APP_DATA_DIR"

      - name: Run real Project lifecycle on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HANK_DESKTOP_E2E_ARTIFACTS: ${{ runner.temp }}\hank-desktop-e2e-artifacts
          HANK_DESKTOP_BIN: ${{ github.workspace }}\apps\desktop\src-tauri\target\debug\hank-desktop.exe
          HANK_E2E_APP_DATA_DIR: ${{ runner.temp }}\hank-e2e-app-data
          HANK_WEBDRIVER_PORT: 4444
          RUST_LOG: info
        run: |
          New-Item -ItemType Directory -Force -Path $env:HANK_DESKTOP_E2E_ARTIFACTS, $env:HANK_E2E_APP_DATA_DIR | Out-Null
          try {
            & powershell -NoProfile -ExecutionPolicy Bypass -File desktop-e2e\run-windows.ps1
            if ($LASTEXITCODE -ne 0) { throw "Desktop E2E failed with exit code $LASTEXITCODE" }
            Remove-Item -LiteralPath $env:HANK_E2E_APP_DATA_DIR -Recurse -Force
          } catch {
            Copy-Item -LiteralPath $env:HANK_E2E_APP_DATA_DIR -Destination (Join-Path $env:HANK_DESKTOP_E2E_ARTIFACTS 'app-data') -Recurse -Force -ErrorAction SilentlyContinue
            throw
          }

      - name: Upload desktop diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-e2e-${{ runner.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hank-desktop-e2e-artifacts/
            ${{ runner.temp }}/hank-e2e-app-data/
          if-no-files-found: warn
          retention-days: 14

  desktop-e2e-required:
    name: Desktop E2E / Project Lifecycle
    if: always()
    needs: project-lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every platform lifecycle test to pass
        env:
          RESULTS: ${{ toJSON(needs.project-lifecycle.result) }}
        run: |
          set -euo pipefail
          test "$RESULTS" = '"success"'

  negative-mutation:
    name: Desktop E2E negative mutation (uncommitted)
    if: github.event_name == 'workflow_dispatch' && inputs.negative_mutation == true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      HANK_DESKTOP_BIN: ${{ github.workspace }}/apps/desktop/src-tauri/target/debug/hank-desktop
      HANK_WEBDRIVER_PORT: 4445
      RUST_LOG: info
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Linux desktop dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          timeout 180s sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          timeout 300s sudo apt-get -o Acquire::ForceIPv4=true -o DPkg::Lock::Timeout=60 -o Dpkg::Use-Pty=0 install --no-install-recommends -y libwebkit2gtk-4.1-dev webkit2gtk-driver xvfb curl build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup pinned Node and Rust
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20.19.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup pinned Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Install pinned tauri-driver
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Install dependencies and build frontend
        run: |
          npm --prefix frontend ci --no-fund
          npm --prefix desktop-e2e ci --no-fund
          npm --prefix frontend run build

      - name: Apply uncommitted missing-command mutation
        env:
          HANK_DESKTOP_E2E_ARTIFACTS: ${{ runner.temp }}/hank-desktop-e2e-negative-artifacts
          HANK_E2E_APP_DATA_DIR: ${{ runner.temp }}/hank-e2e-negative-app-data
        run: |
          set -euo pipefail
          original="$RUNNER_TEMP/confirmations.rs.original"
          cp apps/desktop/src-tauri/src/confirmations.rs "$original"
          restore() { cp "$original" apps/desktop/src-tauri/src/confirmations.rs; }
          trap restore EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/desktop/src-tauri/src/confirmations.rs')
          source = p.read_text()
          target = '        crate::projects::create_project,\n'
          if source.count(target) != 1:
              raise SystemExit('expected exactly one create_project registration')
          p.write_text(source.replace(target, '', 1))
          PY
          cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
          mkdir -p "$HANK_DESKTOP_E2E_ARTIFACTS" "$HANK_E2E_APP_DATA_DIR"
          set +e
          xvfb-run -a --server-args='-screen 0 1280x1024x24' bash desktop-e2e/run-linux.sh
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo 'negative mutation unexpectedly passed' >&2
            exit 1
          fi
          echo "negative mutation detected expected Desktop E2E failure with exit code $status"

      - name: Upload negative mutation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-e2e-negative-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hank-desktop-e2e-negative-artifacts/
            ${{ runner.temp }}/hank-e2e-negative-app-data/
          if-no-files-found: warn
          retention-days: 14
