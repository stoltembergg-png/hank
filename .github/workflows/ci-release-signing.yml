name: Release signing contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-signing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-signing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify release signing contract
        run: node tools/security/release-signing-feature-tests.mjs
