name: Release signing contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-signing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-signing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exact checked out revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Verify release signing contract
        run: node tools/security/release-signing-feature-tests.mjs
      - name: Bind exact source identity into evidence
        run: node tools/security/bind-release-signing-evidence.mjs
