name: Review remediation agent

on:
  pull_request_review:
    types: [submitted]
  check_run:
    types: [completed]

permissions:
  contents: read

concurrency:
  group: review-remediation-${{ github.repository }}-${{ github.event.pull_request.number || github.event.check_run.id }}
  cancel-in-progress: true

jobs:
  collect:
    name: Collect reviewer finding
    if: ${{ github.event_name == 'pull_request_review' || github.event_name == 'check_run' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
      issues: read
    outputs:
      status: ${{ steps.identity.outputs.status }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      source_pr: ${{ steps.identity.outputs.source_pr }}
    steps:
      - name: Checkout trusted helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup trusted Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2

      - name: Collect normalized finding
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -f tools/review-remediation-agent.mjs ]]; then
            node tools/review-remediation-agent.mjs collect \
              --event "$GITHUB_EVENT_PATH" \
              --output collect.json \
              --repository "$GITHUB_REPOSITORY"
          else
            printf '{"status":"NOOP","reason":"HELPER_NOT_ON_DEFAULT_BRANCH"}\n' > collect.json
          fi

      - name: Expose bounded identity
        id: identity
        run: |
          set -euo pipefail
          status="$(node -e "const value=require('./collect.json'); process.stdout.write(String(value.status || ''))")"
          source_sha="$(node -e "const value=require('./collect.json'); process.stdout.write(String(value.finding?.headSha || ''))")"
          source_pr="$(node -e "const value=require('./collect.json'); process.stdout.write(String(value.finding?.pullRequest || ''))")"
          case "$status" in
            READY)
              [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
              [[ "$source_pr" =~ ^[1-9][0-9]*$ ]]
              ;;
            NOOP|HUMAN_REQUIRED)
              source_sha=""
              source_pr=""
              ;;
            *)
              exit 1
              ;;
          esac
          {
            printf 'status=%s\n' "$status"
            printf 'source_sha=%s\n' "$source_sha"
            printf 'source_pr=%s\n' "$source_pr"
          } >> "$GITHUB_OUTPUT"

      - name: Upload collect descriptor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-remediation-collect-${{ github.run_id }}
          path: collect.json
          if-no-files-found: error
          retention-days: 1

  propose:
    name: Judge and propose patch
    needs: collect
    if: ${{ needs.collect.outputs.status == 'READY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      checks: read
      issues: read
    outputs:
      status: ${{ steps.identity.outputs.status }}
    steps:
      - name: Checkout trusted helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup trusted Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2

      - name: Download collect descriptor
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: review-remediation-collect-${{ github.run_id }}

      - name: Call MiMo for bounded viability judgment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          XIAOMI_MIMO_API_KEY: ${{ secrets.XIAOMI_MIMO_API_KEY }}
          MIMO_ENDPOINT: https://api.xiaomimimo.com/v1
          MIMO_MODEL: mimo-v2.5
        run: |
          set -euo pipefail
          node tools/review-remediation-agent.mjs propose \
            --input collect.json \
            --output proposal.json \
            --patch-out proposal.patch \
            --repository "$GITHUB_REPOSITORY"

      - name: Verify proposal artifact digest
        id: identity
        run: |
          set -euo pipefail
          status="$(node -e "const value=require('./proposal.json'); process.stdout.write(String(value.status || ''))")"
          if [[ "$status" == "PROPOSED" ]]; then
            expected="$(node -e "const value=require('./proposal.json'); process.stdout.write(String(value.patchDigest || ''))")"
            actual="$(sha256sum proposal.patch | awk '{print $1}')"
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
            test "$actual" = "$expected"
          elif [[ "$status" != "HUMAN_REQUIRED" && "$status" != "NOOP" ]]; then
            exit 1
          fi
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"

      - name: Upload proposal descriptor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-remediation-proposal-${{ github.run_id }}
          path: proposal.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload proposed patch
        if: ${{ steps.identity.outputs.status == 'PROPOSED' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-remediation-patch-${{ github.run_id }}
          path: proposal.patch
          if-no-files-found: error
          retention-days: 1

  validate:
    name: Validate isolated patch
    needs: [collect, propose]
    if: ${{ needs.propose.outputs.status == 'PROPOSED' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      status: ${{ steps.identity.outputs.status }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup trusted Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2

      - name: Download proposal descriptor
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: review-remediation-proposal-${{ github.run_id }}
          path: proposal

      - name: Download proposed patch
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: review-remediation-patch-${{ github.run_id }}
          path: proposal

      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.collect.outputs.source_sha }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source tree
        env:
          EXPECTED_SHA: ${{ needs.collect.outputs.source_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C target rev-parse HEAD)"
          expected_tree="$(git -C target ls-tree "$EXPECTED_SHA")"
          actual_tree="$(git -C target ls-tree HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          test "$actual_tree" = "$expected_tree"

      - name: Define fixed validation checks
        run: |
          set -euo pipefail
          node -e "require('fs').writeFileSync('tests.json', JSON.stringify(['git diff --check']))"

      - name: Apply and validate bounded patch
        run: |
          set -euo pipefail
          node tools/review-remediation-agent.mjs validate \
            --input proposal/proposal.json \
            --patch proposal/proposal.patch \
            --workspace target \
            --output validation.json \
            --tests tests.json

      - name: Check patch whitespace
        run: |
          set -euo pipefail
          git -C target diff --check

      - name: Expose validation status
        id: identity
        run: |
          set -euo pipefail
          status="$(node -e "const value=require('./validation.json'); process.stdout.write(String(value.status || ''))")"
          test "$status" = "VALIDATED"
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"

      - name: Upload validation descriptor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-remediation-validation-${{ github.run_id }}
          path: validation.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish draft remediation PR
    needs: [collect, propose, validate]
    if: ${{ needs.validate.outputs.status == 'VALIDATED' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup trusted Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2

      - name: Download proposal descriptor
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: review-remediation-proposal-${{ github.run_id }}
          path: proposal

      - name: Download proposed patch
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: review-remediation-patch-${{ github.run_id }}
          path: proposal

      - name: Download validation descriptor
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: review-remediation-validation-${{ github.run_id }}
          path: validation

      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.collect.outputs.source_sha }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source tree
        env:
          EXPECTED_SHA: ${{ needs.collect.outputs.source_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C target rev-parse HEAD)"
          expected_tree="$(git -C target ls-tree "$EXPECTED_SHA")"
          actual_tree="$(git -C target ls-tree HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          test "$actual_tree" = "$expected_tree"

      - name: Revalidate patch and render draft body
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_PR: ${{ needs.collect.outputs.source_pr }}
          EXPECTED_SOURCE_SHA: ${{ needs.collect.outputs.source_sha }}
        run: |
          set -euo pipefail
          proposal_pr="$(node -e "const value=require('./proposal/proposal.json'); process.stdout.write(String(value.finding?.pullRequest || ''))")"
          proposal_sha="$(node -e "const value=require('./proposal/proposal.json'); process.stdout.write(String(value.finding?.headSha || ''))")"
          validation_pr="$(node -e "const value=require('./validation/validation.json'); process.stdout.write(String(value.pullRequest || ''))")"
          validation_sha="$(node -e "const value=require('./validation/validation.json'); process.stdout.write(String(value.sourceSha || ''))")"
          test "$proposal_pr" = "$EXPECTED_SOURCE_PR"
          test "$proposal_sha" = "$EXPECTED_SOURCE_SHA"
          test "$validation_pr" = "$EXPECTED_SOURCE_PR"
          test "$validation_sha" = "$EXPECTED_SOURCE_SHA"
          node tools/review-remediation-agent.mjs publish \
            --input validation/validation.json \
            --proposal proposal/proposal.json \
            --patch proposal/proposal.patch \
            --workspace target \
            --output publish.json \
            --body-out publish-body.md
          status="$(node -e "const value=require('./publish.json'); process.stdout.write(String(value.status || ''))")"
          test "$status" = "PUBLISH_READY"
          expected="$(node -e "const value=require('./validation/validation.json'); process.stdout.write(String(value.patchDigest || ''))")"
          actual="$(sha256sum proposal/proposal.patch | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Create isolated commit
        run: |
          set -euo pipefail
          branch="$(node -e "const value=require('./publish.json'); process.stdout.write(String(value.branch || ''))")"
          case "$branch" in
            review-remediation/pr-[1-9][0-9]*/[0-9a-f]*-[0-9a-f]*) ;;
            *) exit 1 ;;
          esac
          git -C target config core.hooksPath /dev/null
          git -C target config user.name 'Hank reviewer remediation'
          git -C target config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C target switch --create "$branch"
          git -C target add --all
          git -C target diff --cached --check
          expected_files="$(node -e "const value=require('./publish.json'); process.stdout.write(value.files.join('\\n'))")"
          actual_files="$(git -C target diff --cached --name-only)"
          test "$actual_files" = "$expected_files"
          git -C target diff --exit-code -- .
          git -C target commit -m 'fix: apply reviewer remediation'

      - name: Push fingerprint branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="$(node -e "const value=require('./publish.json'); process.stdout.write(String(value.branch || ''))")"
          gh auth setup-git
          git -C target -c core.hooksPath=/dev/null push --set-upstream origin "$branch"

      - name: Create draft remediation PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="$(node -e "const value=require('./publish.json'); process.stdout.write(String(value.branch || ''))")"
          base="$(node -e "const value=require('./publish.json'); process.stdout.write(String(value.base || ''))")"
          pull_request="$(node -e "const value=require('./publish.json'); process.stdout.write(String(value.pullRequest || ''))")"
          gh pr create --draft \
            --repo "$GITHUB_REPOSITORY" \
            --head "$branch" \
            --base "$base" \
            --title "fix: reviewer remediation #$pull_request" \
            --body-file publish-body.md

      - name: Upload publication evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-remediation-publication-${{ github.run_id }}
          path: |
            publish.json
            publish-body.md
          if-no-files-found: error
          retention-days: 7
