name: Resolve review threads on green checks

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  group: resolve-review-threads
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve review threads
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve review threads on open PRs with all checks green
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Effective required checks for the target branch (main).
            // Sources (in priority order):
            // 1. Active applicable rulesets — fully trusted when readable.
            // 2. .github/required-checks.json manifest — committed policy.
            // 3. Classic branch protection — if readable; otherwise the
            //    repository's documented required bot checks serve as a
            //    hardcoded fallback so the per-context gate covers them.
            // The aggregate statusCheckRollup state is also checked as a
            // safety net for any required check the token cannot enumerate.
            const requiredContexts = new Set();

            // Minimal glob matcher for ruleset ref conditions: supports exact
            // refs, `*` and `**` wildcards, and the `~DEFAULT_BRANCH` token.
            const refMatches = (pattern, ref) => {
              if (pattern === '~DEFAULT_BRANCH') return ref === 'refs/heads/main';
              if (pattern === ref) return true;
              const esc = (s) => s.replace(/[.+^${}()|[\]\\]/g, '\\$&');
              const rx = new RegExp(
                '^' + pattern.split('**').map((part) => part.split('*').map(esc).join('[^/]*')).join('.*') + '$',
              );
              return rx.test(ref);
            };

            const rulesetAppliesToMain = (rs) => {
              // Only branch-targeted rulesets can require status checks on a
              // branch; tag rulesets are never part of main's policy.
              if (rs.target && rs.target !== 'branch') return false;
              // Ref conditions, when present, are glob patterns over the full
              // ref (e.g. refs/heads/main, refs/heads/*). Absent conditions
              // mean "all refs". When conditions exist but we cannot match
              // main, the ruleset is not part of main's policy.
              const cond = rs.conditions?.ref_name;
              if (cond && Array.isArray(cond.exclude) && cond.exclude.some((p) => refMatches(p, 'refs/heads/main'))) {
                return false;
              }
              if (cond && Array.isArray(cond.include) && cond.include.length > 0) {
                return cond.include.some((p) => refMatches(p, 'refs/heads/main'));
              }
              return true;
            };

            const addFromRulesets = async () => {
              const rulesets = await github.paginate(github.rest.repos.getRepoRulesets, {
                owner, repo, includes_parents: true, per_page: 100,
              });
              for (const rs of rulesets) {
                if (rs.enforcement !== 'active') continue;
                if (!rulesetAppliesToMain(rs)) continue;
                // We can only read details through the repository endpoint;
                // inherited org/enterprise rulesets are not readable here, so
                // resolve only repository-sourced ones (none exist upstream).
                if (rs.source_type && rs.source_type !== 'Repository') continue;
                const { data: rsDetail } = await github.rest.repos.getRepoRuleset({
                  owner, repo, ruleset_id: rs.id,
                });
                for (const rule of rsDetail.rules ?? []) {
                  if (rule.type === 'required_status_checks') {
                    for (const ctx of rule.parameters?.required_status_checks ?? []) {
                      requiredContexts.add(ctx.context);
                    }
                  }
                }
              }
            };

            const addFromManifest = async () => {
              const { data } = await github.rest.repos.getContent({
                owner, repo, path: '.github/required-checks.json',
              });
              const manifest = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
              if (manifest?.schemaVersion !== 1 || !Array.isArray(manifest.requiredChecks) || manifest.requiredChecks.length === 0) {
                throw new Error('invalid or empty required-checks.json manifest');
              }
              for (const name of manifest.requiredChecks) {
                requiredContexts.add(name);
              }
            };

            // Classic branch protection cannot be read by this token (403),
            // but the repository's documented required bot checks are
            // enforced through it. Adding them explicitly keeps the
            // per-context gate complete even though we cannot enumerate the
            // protection rule itself.
            const addBranchProtectionFallback = async () => {
              for (const name of ['CodeRabbit', 'Aikido Security: check code', 'Aikido Security: Deep Review']) {
                requiredContexts.add(name);
              }
            };

            try {
              await addFromRulesets();
              await addFromManifest();
              await addBranchProtectionFallback();
            } catch (e) {
              core.setFailed(`Could not read required-checks policy (fail closed): ${e.message}`);
              return;
            }
            core.info(`Required checks (${requiredContexts.size}): ${[...requiredContexts].join(', ')}`);

            // --- Open PRs ---
            // Open PRs targeting main — the only base whose required-check
            // policy this workflow evaluates.
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main', per_page: 100,
            });
            core.info(`Found ${prs.length} open pull request(s)`);

            // Hard deadline: stop starting new work well before the job
            // timeout so a slow prefix cannot starve later PRs forever.
            const startedAt = Date.now();
            const RUN_DEADLINE_MS = 240 * 1000; // 4 min of the 5 min budget
            const underDeadline = () => Date.now() - startedAt < RUN_DEADLINE_MS;

            const query = `
              query($owner: String!, $repo: String!, $pr: Int!, $cursor: String, $threadCursor: String) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    state
                    isDraft
                    mergeStateStatus
                    commits(last: 1) {
                      nodes {
                        commit {
                          statusCheckRollup {
                            state
                            contexts(first: 100, after: $cursor) {
                              pageInfo { hasNextPage endCursor }
                              nodes {
                                __typename
                                ... on CheckRun { name status conclusion }
                                ... on StatusContext { context state }
                              }
                            }
                          }
                        }
                      }
                    }
                    reviewThreads(first: 100, after: $threadCursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes { id isResolved }
                    }
                  }
                }
              }`;

            const fetchReviewThreads = async (num) => {
              let threads = [];
              let cursor = null;
              let done = false;
              while (!done) {
                const result = await github.graphql(query, {
                  owner, repo, pr: num, cursor: null, threadCursor: cursor,
                });
                const page = result.repository.pullRequest.reviewThreads;
                threads = threads.concat(page.nodes ?? []);
                if (page.pageInfo?.hasNextPage && page.pageInfo?.endCursor) {
                  cursor = page.pageInfo.endCursor;
                } else {
                  done = true;
                }
              }
              return threads;
            };

            const fetchRollup = async (num) => {
              let allContexts = [];
              let cursor = null;
              let rollupState = null;
              let done = false;
              while (!done) {
                const result = await github.graphql(query, { owner, repo, pr: num, cursor });
                const pull = result.repository.pullRequest;
                rollupState = pull.commits?.nodes?.[0]?.commit?.statusCheckRollup?.state ?? null;
                const rollup = pull.commits?.nodes?.[0]?.commit?.statusCheckRollup;
                const page = rollup?.contexts?.nodes ?? [];
                allContexts = allContexts.concat(page);
                const pageInfo = rollup?.contexts?.pageInfo;
                if (pageInfo?.hasNextPage && pageInfo?.endCursor) {
                  cursor = pageInfo.endCursor;
                } else {
                  done = true;
                }
              }
              return { rollupState, contexts: allContexts };
            };

            const resolveMutation = `
              mutation($id: ID!) {
                resolveReviewThread(input: { threadId: $id }) {
                  thread { id isResolved }
                }
              }`;

            for (const pr of prs) {
              if (!underDeadline()) {
                core.info('Run deadline reached — stopping before the job timeout');
                break;
              }
              const num = pr.number;
              let data;
              try {
                const result = await github.graphql(query, { owner, repo, pr: num });
                data = result.repository.pullRequest;
              } catch (e) {
                core.warning(`PR #${num}: GraphQL query failed: ${e.message}`);
                continue;
              }

              if (data.state !== 'OPEN' || data.isDraft) {
                core.info(`PR #${num}: ${data.state}${data.isDraft ? ' (draft)' : ''} — skipping`);
                continue;
              }

              // Fetch the full statusCheckRollup (paginated) for the head.
              let rollup;
              try {
                rollup = await fetchRollup(num);
              } catch (e) {
                core.warning(`PR #${num}: rollup fetch failed: ${e.message}`);
                continue;
              }

              // Every required check must have a SUCCESS signal in the rollup.
              // Presence is verified per-context so an absent required check
              // cannot be silently omitted from the aggregate rollup state.
              // The rollup aggregate state is NOT used for the gate — it
              // includes non-required checks that would block resolution even
              // when every required check has passed. The per-context check
              // below is the sole gate.
              const greenContexts = new Set();
              for (const c of rollup.contexts) {
                const name = c.__typename === 'CheckRun' ? c.name : c.context;
                const ok = c.__typename === 'CheckRun'
                  ? c.status === 'COMPLETED' && c.conclusion === 'SUCCESS'
                  : c.state === 'SUCCESS';
                if (ok) greenContexts.add(name);
              }

              const missing = [...requiredContexts].filter((ctx) => !greenContexts.has(ctx));
              if (missing.length > 0) {
                core.info(`PR #${num}: ${missing.length} required check(s) not green — skipping`);
                missing.slice(0, 10).forEach((x) => core.info(`  required ${x}: missing or not green`));
                continue;
              }

              // Checks are green. Merge is ready (CLEAN) or blocked only by
              // unresolved threads/reviews (BLOCKED). Never act on DIRTY
              // (conflicts), BEHIND (stale), UNKNOWN, or other states.
              const mergeState = data.mergeStateStatus;
              if (!['BLOCKED', 'CLEAN'].includes(mergeState)) {
                core.info(`PR #${num}: mergeStateStatus=${mergeState} — skipping`);
                continue;
              }

              const open = [];
              try {
                const threads = await fetchReviewThreads(num);
                open.push(...threads.filter((t) => !t.isResolved));
              } catch (e) {
                core.warning(`PR #${num}: review-thread fetch failed: ${e.message}`);
                continue;
              }
              core.info(`PR #${num}: checks green (${mergeState}) — ${open.length} unresolved review thread(s)`);

              if (open.length === 0) {
                core.info(`PR #${num}: nothing to resolve`);
                continue;
              }

              let resolvedCount = 0;
              for (const thread of open) {
                try {
                  await github.graphql(resolveMutation, { id: thread.id });
                  resolvedCount += 1;
                  core.info(`PR #${num}: resolved ${thread.id.slice(0, 24)}...`);
                } catch (e) {
                  core.warning(`PR #${num}: failed to resolve ${thread.id.slice(0, 24)}...: ${e.message}`);
                }
              }
              core.info(`PR #${num}: resolved ${resolvedCount}/${open.length} thread(s)`);
            }