name: Build Frontend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup pinned Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20.19.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Record build identity
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "sha=${GITHUB_SHA}"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "runner=${RUNNER_OS}"
            echo "node=$(node --version)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install locked dependencies
        run: npm ci --no-fund

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Verify desktop frontend asset references
        working-directory: .
        run: |
          node --test test/desktop-frontend-assets.test.mjs test/desktop-dev-launcher.test.mjs
          node tools/verify-desktop-frontend-assets.mjs frontend/dist

      - name: Upload frontend build artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontend-build-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

      - name: Require artifact digest
        working-directory: .
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: tools/ci/require-artifact-digest.sh

      - name: Record artifact digest
        working-directory: .
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: echo "frontend_artifact_digest=$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
