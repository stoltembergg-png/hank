name: Build Frontend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup pinned Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Record build identity
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "sha=${GITHUB_SHA}"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "runner=${RUNNER_OS}"
            echo "node=$(node --version)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install locked dependencies
        run: npm ci --no-fund

      - name: Audit frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=3
          audit_status=1
          export npm_config_fetch_timeout=60000
          export npm_config_fetch_retries=0
          for attempt in $(seq 1 "$max_attempts"); do
            audit_log=$(mktemp)
            set +e
            exec 3>&1
            exec >"$audit_log" 2>&1
            npm audit --audit-level=high
            audit_status=$?
            exec 1>&3 3>&-
            set -e
            cat "$audit_log"
            if [ "$audit_status" -eq 0 ]; then
              rm -f "$audit_log"
              exit 0
            fi
            if ! grep -Eq '(^|[^0-9])5[0-9]{2}([^0-9]|$)|Service Unavailable|ECONNRESET|ETIMEDOUT|EAI_AGAIN' "$audit_log"; then
              rm -f "$audit_log"
              exit "$audit_status"
            fi
            rm -f "$audit_log"
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "npm audit transient registry failure; retrying ($((attempt + 1))/$max_attempts)"
              sleep $((attempt * 15))
            fi
          done
          exit "$audit_status"

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Verify desktop frontend asset references
        working-directory: .
        run: |
          node --test test/desktop-frontend-assets.test.mjs test/desktop-dev-launcher.test.mjs
          node tools/verify-desktop-frontend-assets.mjs frontend/dist

      - name: Upload frontend build artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontend-build-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

      - name: Require artifact digest
        working-directory: .
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: tools/ci/require-artifact-digest.sh

      - name: Record artifact digest
        working-directory: .
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: echo "frontend_artifact_digest=$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
