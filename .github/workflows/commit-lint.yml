name: Commit lint

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commit-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    name: Commit lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate commit messages
        run: node tools/commit-message-lint.mjs --range origin/main...HEAD

      - name: Run commit lint fixtures
        run: node --test tools/commit-message-lint.spec.mjs
