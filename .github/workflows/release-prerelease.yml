name: Publish testable prerelease

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-prerelease-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight and post-merge gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      sha: ${{ steps.identity.outputs.sha }}
      tree: ${{ steps.identity.outputs.tree }}
      card: ${{ steps.provenance.outputs.card }}
      prs: ${{ steps.provenance.outputs.prs }}
      classification: ${{ steps.provenance.outputs.classification }}
      range: ${{ steps.provenance.outputs.range }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Require integrated main commit
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git branch --show-current)" != "HEAD" || git show-ref --verify --quiet refs/remotes/origin/main
          test "$(git merge-base HEAD origin/main)" = "$GITHUB_SHA"

      - name: Load active milestone version and release boundary
        run: |
          set -euo pipefail
          metadata=$(node --input-type=module -e "import fs from 'node:fs'; const config = JSON.parse(fs.readFileSync('release-milestones.json', 'utf8')); const active = config.active; const boundary = active?.releaseBoundary; if (config.schemaVersion !== 1 || !active?.version || !active?.milestone || !boundary?.previousStableTag || !boundary?.card || !/^PR-[0-9]+$/.test(boundary.card)) process.exit(1); process.stdout.write(JSON.stringify({version: active.version, milestone: active.milestone, previousStableTag: boundary.previousStableTag, card: boundary.card}))")
          printf '%s\n' "$metadata" | jq -e '.version and .milestone and .previousStableTag and (.card | test("^PR-[0-9]+$"))' >/dev/null
          {
            echo "BASE_VERSION=$(printf '%s' "$metadata" | jq -r .version)"
            echo "MILESTONE=$(printf '%s' "$metadata" | jq -r .milestone)"
            echo "PREVIOUS_STABLE_TAG=$(printf '%s' "$metadata" | jq -r .previousStableTag)"
            echo "RELEASE_CARD=$(printf '%s' "$metadata" | jq -r .card)"
          } >> "$GITHUB_ENV"

      - name: Verify version manifests
        run: node tools/release-prerelease.mjs verify-version

      - name: Capture immutable identity
        id: identity
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          tag=$(node tools/release-prerelease.mjs tag --version "$BASE_VERSION" --sha "$sha")
          {
            echo "sha=$sha"
            echo "tree=$tree"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Check tag and release idempotency
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.identity.outputs.tag }}
          SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          tag_ref=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
          if test -z "$tag_ref"; then
            echo 'tag absent; create path authorized'
            exit 0
          fi
          release=$(gh api "repos/$REPOSITORY/releases/tags/$TAG" 2>/dev/null || true)
          test -n "$release" || { echo 'tag exists without release; refusing reuse'; exit 1; }
          target=$(printf '%s' "$release" | jq -r .target_commitish)
          test "$target" = "$SHA" || { echo 'existing release targets a different commit; refusing reuse'; exit 1; }
          echo 'matching tag and release found; rerun will be idempotent'

      - name: Verify release boundary and merged PR provenance
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.identity.outputs.sha }}
          PREVIOUS_STABLE_TAG: ${{ env.PREVIOUS_STABLE_TAG }}
          RELEASE_CARD: ${{ env.RELEASE_CARD }}
        run: |
          set -euo pipefail
          previous_sha=$(git rev-parse "${PREVIOUS_STABLE_TAG}^{commit}")
          git merge-base --is-ancestor "$previous_sha" "$SHA"
          previous_release=$(gh api "repos/$REPOSITORY/releases/tags/$PREVIOUS_STABLE_TAG")
          test "$(printf '%s' "$previous_release" | jq -r .prerelease)" = false
          range="$PREVIOUS_STABLE_TAG..$SHA"
          compare_pages=$(gh api --paginate "repos/$REPOSITORY/compare/$PREVIOUS_STABLE_TAG...$SHA")
          commits=$(printf '%s\n' "$compare_pages" | jq -rs '.[].commits[]?.sha')
          prs=$(for commit_sha in $commits; do gh api "repos/$REPOSITORY/commits/$commit_sha/pulls" --jq '.[].number'; done | jq -Rsc 'split("\n") | map(select(length > 0) | tonumber) | unique | sort')
          test "$prs" != "[]"
          card_number=${RELEASE_CARD#PR-}
          node --input-type=module -e "const prs=JSON.parse(process.argv[1]); const card=Number(process.argv[2]); if (!prs.includes(card)) process.exit(1)" "$prs" "$card_number"
          card_json=$(gh api "repos/$REPOSITORY/pulls/$card_number")
          test "$(printf '%s' "$card_json" | jq -r .state)" = closed
          test "$(printf '%s' "$card_json" | jq -r .merged_at)" != null
          card_sha=$(printf '%s' "$card_json" | jq -r .merge_commit_sha)
          test "$card_sha" != null
          git merge-base --is-ancestor "$card_sha" "$SHA"
          git log "$range" --format=%s > /tmp/release-subjects.txt
          classification=$(node tools/release-prerelease.mjs classify --file /tmp/release-subjects.txt)
          {
            echo "prs=$prs"
            echo "card=$RELEASE_CARD"
            echo "classification=$classification"
            echo "range=$range"
          } >> "$GITHUB_OUTPUT"

      - name: Require prerelease manifest matches active ruleset
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.identity.outputs.sha }}
          TREE: ${{ steps.identity.outputs.tree }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$REPOSITORY/rules/branches/main" > /tmp/active-rules-pages.json
          node --input-type=module -e "import fs from 'node:fs'; const pages = JSON.parse(fs.readFileSync('/tmp/active-rules-pages.json', 'utf8')); if (!Array.isArray(pages) || pages.some((page) => !Array.isArray(page))) process.exit(1); const rules = pages.flat(); if (!rules.length) process.exit(1); fs.writeFileSync('/tmp/active-rules.json', JSON.stringify({ schemaVersion: 1, repository: process.env.REPOSITORY, ref: 'refs/heads/main', sha: process.env.SHA, tree: process.env.TREE, complete: true, rules }) + '\\n');"
          node tools/release-required-checks.mjs validate \
            --manifest .github/required-checks.json \
            --rules /tmp/active-rules.json \
            --repository "$REPOSITORY" \
            --ref refs/heads/main \
            --sha "$SHA" \
            --tree "$TREE" \
            --output /tmp/required-checks.txt

      - name: Wait for required post-merge checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            echo "polling required post-merge checks: attempt $attempt/40"
            required=$(cat /tmp/required-checks.txt)
            # --paginate emits one JSON document per page; --slurp is required before
            # parsing so a multi-page response cannot be treated as concatenated JSON.
            gh api --paginate --slurp "repos/$REPOSITORY/commits/$SHA/check-runs" > /tmp/check-runs-pages.json
            node --input-type=module - <<'NODE' > /tmp/checks.json
            import fs from 'node:fs';
            const pages = JSON.parse(fs.readFileSync('/tmp/check-runs-pages.json', 'utf8'));
            if (!Array.isArray(pages) || pages.some((page) => !page || !Array.isArray(page.check_runs))) {
              throw new Error('check-runs response must be a slurped array of pages');
            }
            const checks = pages.flatMap((page) => page.check_runs.map(({ name, status, conclusion }) => ({ name, status, conclusion })));
            process.stdout.write(`${JSON.stringify(checks)}\n`);
            NODE
            node tools/release-prerelease.mjs checks --file /tmp/checks.json --required "$required" && exit 0
            sleep 30
          done
          echo "required post-merge checks did not reach success" >&2
          exit 1

      - name: Record preflight evidence
        run: |
          {
            echo "### Prerelease preflight"
            echo "- Exact main commit: ${{ steps.identity.outputs.sha }}"
            echo "- Immutable tag candidate: ${{ steps.identity.outputs.tag }}"
            echo "- Logical card: ${{ steps.provenance.outputs.card }}"
            echo "- Classification: ${{ steps.provenance.outputs.classification }}"
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Package prerelease artifacts
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Generate changelog and test instructions
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          SHA: ${{ needs.preflight.outputs.sha }}
          CARD: ${{ needs.preflight.outputs.card }}
          PRS: ${{ needs.preflight.outputs.prs }}
          CLASSIFICATION: ${{ needs.preflight.outputs.classification }}
          RANGE: ${{ needs.preflight.outputs.range }}
          TREE: ${{ needs.preflight.outputs.tree }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/prerelease
          prs_csv=$(node --input-type=module -e "process.stdout.write(JSON.parse(process.argv[1]).join(','))" "$PRS")
          node tools/release-prerelease.mjs changelog --tag "$TAG" --card "$CARD" --prs "$prs_csv" --range "$RANGE" --sha "$SHA" --tree "$TREE" > /tmp/prerelease/RELEASE_NOTES.md
          node tools/release-sbom.mjs generate --root . --commit "$SHA" --tree "$TREE" --version "${TAG#v}" --output /tmp/prerelease/SBOM.spdx.json
          node tools/release-sbom.mjs verify --file /tmp/prerelease/SBOM.spdx.json --commit "$SHA" --tree "$TREE" --version "${TAG#v}"
          printf '%s\n' "Download the archive, SBOM.spdx.json and release-manifest.json. Verify manifest.sha256 and SHA256SUMS, confirm exact commit $SHA, validate the SPDX SBOM identity, then run cargo test --workspace --locked and npm --prefix frontend test. This is a prerelease and is not a stable release." > /tmp/prerelease/TEST_INSTRUCTIONS.md
          tar --exclude='./.git' --exclude='./frontend/node_modules' --exclude='./target' --exclude='./apps/desktop/src-tauri/target' -czf "/tmp/prerelease/hank-${TAG}.tar.gz" .

      - name: Upload prerelease bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prerelease-${{ needs.preflight.outputs.tag }}
          path: /tmp/prerelease/
          if-no-files-found: error
          retention-days: 7

  windows-package:
    name: Build Windows installer
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Setup pinned Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20.19.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-fund

      - name: Build frontend bundle
        shell: pwsh
        run: npm --prefix frontend run build

      - name: Verify frontend asset paths
        shell: pwsh
        run: |
          $index = Get-Content -Raw frontend/dist/index.html
          if ($index -notmatch 'src="\./assets/' -or $index -notmatch 'href="\./assets/') {
            throw 'Packaged frontend must reference assets with relative paths'
          }
          if ($index -match '(src|href)="/assets/') {
            throw 'Packaged frontend contains an absolute asset path'
          }

      - name: Build Windows NSIS installer
        shell: pwsh
        env:
          HANK_BUILD_COMMIT_SHA: ${{ needs.preflight.outputs.sha }}
          HANK_BUILD_TREE_SHA: ${{ needs.preflight.outputs.tree }}
        run: |
          $config = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/src-tauri/tauri.conf.json'
          npm --prefix frontend exec -- tauri build --ci --config $config --bundles nsis

      - name: Rename installer deterministically
        shell: pwsh
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          $installer = Get-ChildItem -Path apps/desktop/src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installer was not generated' }
          Copy-Item $installer.FullName "apps/desktop/src-tauri/target/release/bundle/nsis/hank-$env:TAG-setup.exe"

      - name: Install Windows package for E2E
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path apps/desktop/src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installer was not found for E2E' }
          $installDir = Join-Path $env:RUNNER_TEMP 'hank-desktop-e2e'
          $arguments = @('/S', "/D=$installDir")
          $result = Start-Process -FilePath $installer.FullName -ArgumentList $arguments -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "NSIS installation failed with exit code $($result.ExitCode)" }
          $executable = Join-Path $installDir 'hank-desktop.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "installed desktop executable not found: $executable"
          }
          $profile = Join-Path $env:RUNNER_TEMP 'hank-desktop-e2e-profile'
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          $listener.Stop()
          $process = Start-Process -FilePath $executable `
            -WorkingDirectory (Split-Path -Parent $executable) `
            -Environment @{
              WEBVIEW2_USER_DATA_FOLDER = $profile
              WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=$port"
            } `
            -PassThru
          try {
            node tools/windows-desktop-e2e.mjs --executable $executable --port $port --pid $process.Id
            if ($LASTEXITCODE -ne 0) { throw "Windows desktop E2E failed with exit code $LASTEXITCODE" }
          } finally {
            try {
              $process.Refresh()
              if (-not $process.HasExited) { $process | Stop-Process -Force -ErrorAction SilentlyContinue }
            } catch { }
            Remove-Item -LiteralPath $profile -Recurse -Force -ErrorAction SilentlyContinue
          }
          exit 0

      - name: Run installed Windows Project lifecycle E2E
        shell: pwsh
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          COMMIT_SHA: ${{ needs.preflight.outputs.sha }}
          TREE_SHA: ${{ needs.preflight.outputs.tree }}
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'hank-desktop-e2e'
          $executable = Join-Path $installDir 'hank-desktop.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) { throw "installed desktop executable not found: $executable" }
          npm --prefix desktop-e2e ci --no-fund
          cargo install tauri-driver --version 2.0.6 --locked
          $env:HANK_DESKTOP_BIN = $executable
          $env:HANK_E2E_APP_DATA_DIR = Join-Path $env:RUNNER_TEMP 'hank-desktop-lifecycle-data'
          $env:HANK_E2E_ALLOW_RELEASE_DATA_DIR = '1'
          $env:HANK_E2E_MOCK_PROVIDER = '1'
          $env:HANK_DESKTOP_E2E_ARTIFACTS = Join-Path $env:RUNNER_TEMP 'hank-desktop-lifecycle-artifacts'
          $env:HANK_WEBDRIVER_PORT = '4444'
          $env:HANK_EXPECTED_VERSION = $env:TAG.Substring(1)
          $env:HANK_EXPECTED_NATIVE_VERSION = (Get-Content -Raw apps/desktop/src-tauri/Cargo.toml | Select-String -Pattern '^version\s*=\s*"([^"]+)"' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          $env:HANK_EXPECTED_COMMIT_SHA = $env:COMMIT_SHA
          $env:HANK_EXPECTED_TREE_SHA = $env:TREE_SHA
          $env:HANK_REQUIRE_ARTIFACT_PROVENANCE = '1'
          $env:RUST_LOG = 'info'
          New-Item -ItemType Directory -Force -Path $env:HANK_DESKTOP_E2E_ARTIFACTS, $env:HANK_E2E_APP_DATA_DIR | Out-Null
          & powershell -NoProfile -ExecutionPolicy Bypass -File desktop-e2e\run-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "installed Windows Project lifecycle E2E failed with exit code $LASTEXITCODE" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-installer-${{ needs.preflight.outputs.tag }}
          path: apps/desktop/src-tauri/target/release/bundle/nsis/hank-${{ needs.preflight.outputs.tag }}-setup.exe
          if-no-files-found: error
          retention-days: 7

  linux-package:
    name: Build Linux AppImage
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Install Linux desktop dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          timeout 180s sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          timeout 300s sudo apt-get -o Acquire::ForceIPv4=true -o DPkg::Lock::Timeout=60 -o Dpkg::Use-Pty=0 install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev build-essential curl file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup pinned Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20.19.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-fund

      - name: Build frontend bundle
        run: npm --prefix frontend run build

      - name: Build Linux AppImage
        env:
          HANK_BUILD_COMMIT_SHA: ${{ needs.preflight.outputs.sha }}
          HANK_BUILD_TREE_SHA: ${{ needs.preflight.outputs.tree }}
        run: |
          set -euo pipefail
          config="$GITHUB_WORKSPACE/apps/desktop/src-tauri/tauri.conf.json"
          npm --prefix frontend exec -- tauri build --ci --config "$config" --bundles appimage

      - name: Rename AppImage deterministically
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          installer=$(find apps/desktop/src-tauri/target/release/bundle -type f -name '*.AppImage' -print -quit)
          test -n "$installer"
          cp "$installer" "apps/desktop/src-tauri/target/release/bundle/hank-${TAG}-x86_64.AppImage"

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-appimage-${{ needs.preflight.outputs.tag }}
          path: apps/desktop/src-tauri/target/release/bundle/hank-${{ needs.preflight.outputs.tag }}-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign release artifacts in protected environment
    needs: [preflight, package, windows-package, linux-package]
    runs-on: ubuntu-24.04
    environment: release-signing
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Setup pinned Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20.19.1

      - name: Download release artifacts for signing
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: prerelease-${{ needs.preflight.outputs.tag }}
          path: /tmp/prerelease

      - name: Download Windows installer for signing
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-installer-${{ needs.preflight.outputs.tag }}
          path: /tmp/windows-bundle

      - name: Download Linux AppImage for signing
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: linux-appimage-${{ needs.preflight.outputs.tag }}
          path: /tmp/linux-bundle

      - name: Sign exact release artifacts
        env:
          HANK_RELEASE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.HANK_RELEASE_SIGNING_PRIVATE_KEY_PEM }}
          HANK_RELEASE_SIGNING_PUBLIC_KEY_PEM: ${{ vars.HANK_RELEASE_SIGNING_PUBLIC_KEY_PEM }}
          HANK_RELEASE_SIGNER_KEY_ID: ${{ vars.HANK_RELEASE_SIGNER_KEY_ID }}
          TAG: ${{ needs.preflight.outputs.tag }}
          SHA: ${{ needs.preflight.outputs.sha }}
          TREE: ${{ needs.preflight.outputs.tree }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-assets /tmp/release-signing
          cp "/tmp/prerelease/hank-${TAG}.tar.gz" /tmp/release-assets/
          cp "/tmp/windows-bundle/hank-${TAG}-setup.exe" /tmp/release-assets/
          cp "/tmp/linux-bundle/hank-${TAG}-x86_64.AppImage" /tmp/release-assets/
          node tools/release-artifact-signing.mjs sign \
            --directory /tmp/release-assets \
            --attestationDirectory /tmp/release-signing \
            --artifacts "hank-${TAG}.tar.gz,hank-${TAG}-setup.exe,hank-${TAG}-x86_64.AppImage" \
            --repository "$GITHUB_REPOSITORY" \
            --event "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --commit "$SHA" \
            --tree "$TREE" \
            --workflow "$GITHUB_WORKFLOW" \
            --policy release-prerelease-v1 \
            --channel prerelease \
            --os multi \
            --signerKeyId "$HANK_RELEASE_SIGNER_KEY_ID"
          version_code=$(node tools/release-updater-bundle.mjs version-code --version "$TAG")
          next_version=$((version_code + 1))
          node tools/release-updater-bundle.mjs create \
            --artifact "/tmp/release-assets/hank-${TAG}-setup.exe" \
            --attestation "/tmp/release-signing/hank-${TAG}-setup.exe.attestation.json" \
            --output "/tmp/release-signing/hank-${TAG}-windows-updater.json" \
            --version "$version_code" \
            --next-version "$next_version" \
            --expires-at 4102444800 \
            --os windows \
            --arch x86_64
          node tools/release-updater-bundle.mjs create \
            --artifact "/tmp/release-assets/hank-${TAG}-x86_64.AppImage" \
            --attestation "/tmp/release-signing/hank-${TAG}-x86_64.AppImage.attestation.json" \
            --output "/tmp/release-signing/hank-${TAG}-linux-updater.json" \
            --version "$version_code" \
            --next-version "$next_version" \
            --expires-at 4102444800 \
            --os linux \
            --arch x86_64

      - name: Upload protected signing evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-signing-${{ needs.preflight.outputs.tag }}
          path: /tmp/release-signing/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish immutable GitHub prerelease
    needs: [preflight, package, windows-package, linux-package, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Download prerelease bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: prerelease-${{ needs.preflight.outputs.tag }}
          path: /tmp/prerelease

      - name: Download Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-installer-${{ needs.preflight.outputs.tag }}
          path: /tmp/windows-bundle

      - name: Download Linux AppImage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: linux-appimage-${{ needs.preflight.outputs.tag }}
          path: /tmp/linux-bundle

      - name: Download protected signing evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-signing-${{ needs.preflight.outputs.tag }}
          path: /tmp/release-signing

      - name: Bind and verify release artifacts
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          SHA: ${{ needs.preflight.outputs.sha }}
          TREE: ${{ needs.preflight.outputs.tree }}
          CARD: ${{ needs.preflight.outputs.card }}
          PRS: ${{ needs.preflight.outputs.prs }}
          CLASSIFICATION: ${{ needs.preflight.outputs.classification }}
          HANK_RELEASE_SIGNING_PUBLIC_KEY_PEM: ${{ vars.HANK_RELEASE_SIGNING_PUBLIC_KEY_PEM }}
          HANK_RELEASE_SIGNER_KEY_ID: ${{ vars.HANK_RELEASE_SIGNER_KEY_ID }}
        run: |
          set -euo pipefail
          installer="/tmp/windows-bundle/hank-${TAG}-setup.exe"
          appimage="/tmp/linux-bundle/hank-${TAG}-x86_64.AppImage"
          test -f "$installer"
          test -f "$appimage"
          cp "$installer" "/tmp/prerelease/hank-${TAG}-setup.exe"
          cp "$appimage" "/tmp/prerelease/hank-${TAG}-x86_64.AppImage"
          sbom="SBOM.spdx.json"
          test -f "/tmp/prerelease/$sbom"
          names=("hank-${TAG}.tar.gz" "hank-${TAG}-setup.exe" "hank-${TAG}-x86_64.AppImage" "$sbom")
          signing_files=(
            "hank-${TAG}.tar.gz.attestation.json"
            "hank-${TAG}-setup.exe.attestation.json"
            "hank-${TAG}-x86_64.AppImage.attestation.json"
            "release-signing-metadata.json"
          )
          for file in "${signing_files[@]}"; do cp "/tmp/release-signing/$file" "/tmp/prerelease/$file"; done
          node tools/release-artifact-signing.mjs verify \
            --directory /tmp/prerelease \
            --attestationDirectory /tmp/prerelease \
            --artifacts "$(IFS=,; echo "${names[*]}")" \
            --commit "$SHA" \
            --tree "$TREE" \
            --requireTrustedKey 1 \
            --signerKeyId "$HANK_RELEASE_SIGNER_KEY_ID"
          node tools/release-sbom.mjs verify \
            --file "/tmp/prerelease/$sbom" \
            --commit "$SHA" \
            --tree "$TREE" \
            --version "${TAG#v}"
          (cd /tmp/prerelease && sha256sum "${names[@]}" "${signing_files[@]}" > SHA256SUMS)
          node --input-type=module - <<'NODE' > /tmp/manifest-input.json
          import fs from 'node:fs';
          import { buildArtifactDigests } from './tools/release-prerelease.mjs';
          const tag = process.env.TAG;
          const names = [
            `hank-${tag}.tar.gz`,
            `hank-${tag}-setup.exe`,
            `hank-${tag}-x86_64.AppImage`,
            'SBOM.spdx.json',
          ];
          const signedNames = names.filter((name) => name !== 'SBOM.spdx.json');
          const signingFiles = [
            ...signedNames.map((name) => `${name}.attestation.json`),
            'release-signing-metadata.json',
          ];
          const changelog = fs.readFileSync('/tmp/prerelease/RELEASE_NOTES.md', 'utf8');
          const testInstructions = fs.readFileSync('/tmp/prerelease/TEST_INSTRUCTIONS.md', 'utf8');
          process.stdout.write(JSON.stringify({
            tag, version: tag.slice(1), sha: process.env.SHA, tree: process.env.TREE,
            card: process.env.CARD, classification: JSON.parse(process.env.CLASSIFICATION),
            relatedPullRequests: JSON.parse(process.env.PRS),
            artifacts: [...names, ...signingFiles, 'RELEASE_NOTES.md', 'TEST_INSTRUCTIONS.md', 'SHA256SUMS'],
            artifactDigests: buildArtifactDigests({ directory: '/tmp/prerelease', names }),
            changelog, testInstructions,
          }));
          NODE
          node tools/release-prerelease.mjs manifest --input /tmp/manifest-input.json --output /tmp/prerelease/release-manifest.json
          node tools/release-prerelease.mjs verify-artifacts --manifest /tmp/prerelease/release-manifest.json --directory /tmp/prerelease
          (cd /tmp/prerelease && sha256sum release-manifest.json > manifest.sha256)

      - name: Publish or verify idempotent release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
          SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail
          tag_ref=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
          if test -n "$tag_ref"; then
            release=$(gh api "repos/$REPOSITORY/releases/tags/$TAG" 2>/dev/null || true)
            test -n "$release" || { echo 'tag exists without release; refusing reuse'; exit 1; }
            target=$(printf '%s' "$release" | jq -r '.target_commitish')
            test "$target" = "$SHA" || { echo 'existing release targets a different commit'; exit 1; }
            rm -rf /tmp/existing-prerelease
            mkdir -p /tmp/existing-prerelease
            gh release download "$TAG" --repo "$REPOSITORY" --pattern release-manifest.json --dir /tmp/existing-prerelease
            cmp /tmp/prerelease/release-manifest.json /tmp/existing-prerelease/release-manifest.json
            echo 'matching release already exists; idempotent no-op'
          else
            gh release create "$TAG" \
              "/tmp/prerelease/hank-${TAG}.tar.gz" \
              "/tmp/windows-bundle/hank-${TAG}-setup.exe" \
              "/tmp/linux-bundle/hank-${TAG}-x86_64.AppImage" \
              "/tmp/prerelease/SBOM.spdx.json" \
              "/tmp/prerelease/hank-${TAG}.tar.gz.attestation.json" \
              "/tmp/prerelease/hank-${TAG}-setup.exe.attestation.json" \
              "/tmp/prerelease/hank-${TAG}-x86_64.AppImage.attestation.json" \
              /tmp/prerelease/release-signing-metadata.json \
              /tmp/prerelease/RELEASE_NOTES.md /tmp/prerelease/TEST_INSTRUCTIONS.md /tmp/prerelease/SHA256SUMS /tmp/prerelease/release-manifest.json /tmp/prerelease/manifest.sha256 \
              --target "$SHA" --title "$TAG (prerelease)" --notes-file /tmp/prerelease/RELEASE_NOTES.md --prerelease
          fi

      - name: Verify immutable publication
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
          SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail
          published_ref=$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')
          test "$published_ref" = "$SHA"
          release=$(gh api "repos/$REPOSITORY/releases/tags/$TAG")
          prerelease=$(printf '%s' "$release" | jq -r .prerelease)
          target=$(printf '%s' "$release" | jq -r .target_commitish)
          test "$prerelease" = true
          test "$target" = "$SHA"
          {
            echo "### Published prerelease"
            echo "- Tag: $TAG"
            echo "- Exact main commit: $SHA"
            echo "- Prerelease: true"
            echo "- Tag overwrite: prohibited"
          } >> "$GITHUB_STEP_SUMMARY"

  install-smoke:
    name: Clean-room Windows install smoke
    needs: [preflight, publish]
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Setup pinned Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20.19.1

      - name: Setup pinned Rust toolchain for updater E2E
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1

      - name: Install updater E2E dependencies
        shell: pwsh
        run: |
          npm --prefix frontend ci --no-fund
          npm --prefix frontend run build
          npm --prefix desktop-e2e ci --no-fund
          cargo install tauri-driver --version 2.0.6 --locked

      - name: Download protected updater bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-signing-${{ needs.preflight.outputs.tag }}
          path: ${{ runner.temp }}/release-signing

      - name: Download and verify published release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
          SHA: ${{ needs.preflight.outputs.sha }}
          TREE: ${{ needs.preflight.outputs.tree }}
          HANK_UPDATER_E2E: '1'
          HANK_UPDATER_REQUIRE_RELEASE_BUNDLE: '1'
        run: |
          $releaseDirectory = Join-Path $env:RUNNER_TEMP 'hank-release-assets'
          New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null
          gh release download $env:TAG --repo $env:REPOSITORY `
            --pattern release-manifest.json `
            --pattern manifest.sha256 `
            --pattern SHA256SUMS `
            --pattern SBOM.spdx.json `
            --pattern "hank-$env:TAG.tar.gz" `
            --pattern "hank-$env:TAG-setup.exe" `
            --pattern "hank-$env:TAG-x86_64.AppImage" `
            --pattern "hank-$env:TAG.tar.gz.attestation.json" `
            --pattern "hank-$env:TAG-setup.exe.attestation.json" `
            --pattern "hank-$env:TAG-x86_64.AppImage.attestation.json" `
            --pattern release-signing-metadata.json `
            --dir $releaseDirectory
          if ($LASTEXITCODE -ne 0) { throw "release asset download failed with exit code $LASTEXITCODE" }
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "release-signing/hank-$($env:TAG)-windows-updater.json") -Destination $releaseDirectory -Force
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "release-signing/hank-$($env:TAG)-linux-updater.json") -Destination $releaseDirectory -Force
          & powershell -NoProfile -ExecutionPolicy Bypass -File desktop-e2e\install-smoke-windows.ps1 `
            -ReleaseDirectory $releaseDirectory `
            -ReleaseTag $env:TAG `
            -ExpectedCommit $env:SHA `
            -ExpectedTree $env:TREE `
            -ReportPath (Join-Path $env:RUNNER_TEMP 'hank-install-smoke-report.json')
          if ($LASTEXITCODE -ne 0) { throw "clean-room install smoke failed with exit code $LASTEXITCODE" }

      - name: Upload clean-room install evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-install-smoke-${{ needs.preflight.outputs.tag }}
          path: ${{ runner.temp }}/hank-install-smoke-report.json
          if-no-files-found: warn
          retention-days: 14

  linux-install-smoke:
    name: Clean-room Linux install smoke
    needs: [preflight, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Install Linux desktop dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          timeout 180s sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          timeout 300s sudo apt-get -o Acquire::ForceIPv4=true -o DPkg::Lock::Timeout=60 -o Dpkg::Use-Pty=0 install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev webkit2gtk-driver xvfb curl build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup pinned Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20.19.1
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop-e2e/package-lock.json

      - name: Setup pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1

      - name: Install E2E dependencies and driver
        run: |
          set -euo pipefail
          npm --prefix frontend ci --no-fund
          npm --prefix desktop-e2e ci --no-fund
          npm --prefix frontend run build
          cargo install tauri-driver --version 2.0.6 --locked

      - name: Download protected updater bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-signing-${{ needs.preflight.outputs.tag }}
          path: ${{ runner.temp }}/release-signing

      - name: Download and run Linux clean-room smoke
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
          SHA: ${{ needs.preflight.outputs.sha }}
          TREE: ${{ needs.preflight.outputs.tree }}
          HANK_RELEASE_DIR: ${{ runner.temp }}/hank-release-assets
          HANK_INSTALL_SMOKE_REPORT: ${{ runner.temp }}/hank-install-smoke-report.json
          HANK_E2E_APP_DATA_DIR: ${{ runner.temp }}/hank-release-e2e-data
          HANK_DESKTOP_E2E_ARTIFACTS: ${{ runner.temp }}/hank-release-e2e-artifacts
          HANK_NODE_BIN: node
          HANK_UPDATER_E2E: '1'
          HANK_UPDATER_REQUIRE_RELEASE_BUNDLE: '1'
        run: |
          set -euo pipefail
          mkdir -p "$HANK_RELEASE_DIR"
          gh release download "$TAG" --repo "$REPOSITORY" \
            --pattern release-manifest.json \
            --pattern manifest.sha256 \
            --pattern SHA256SUMS \
            --pattern SBOM.spdx.json \
            --pattern "hank-${TAG}.tar.gz" \
            --pattern "hank-${TAG}-setup.exe" \
            --pattern "hank-${TAG}-x86_64.AppImage" \
            --pattern "hank-${TAG}.tar.gz.attestation.json" \
            --pattern "hank-${TAG}-setup.exe.attestation.json" \
            --pattern "hank-${TAG}-x86_64.AppImage.attestation.json" \
            --pattern release-signing-metadata.json \
            --dir "$HANK_RELEASE_DIR"
          cp "$RUNNER_TEMP/release-signing/hank-${TAG}-windows-updater.json" "$HANK_RELEASE_DIR/"
          cp "$RUNNER_TEMP/release-signing/hank-${TAG}-linux-updater.json" "$HANK_RELEASE_DIR/"
          HANK_RELEASE_TAG="$TAG" HANK_EXPECTED_COMMIT="$SHA" HANK_EXPECTED_TREE="$TREE" \
            bash desktop-e2e/install-smoke-linux.sh

      - name: Upload Linux clean-room install evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-install-smoke-linux-${{ needs.preflight.outputs.tag }}
          path: |
            ${{ runner.temp }}/hank-install-smoke-report.json
            ${{ runner.temp }}/hank-release-e2e-artifacts/
            ${{ runner.temp }}/hank-release-e2e-data/
          if-no-files-found: warn
          retention-days: 14
