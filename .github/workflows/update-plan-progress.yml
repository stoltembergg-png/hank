name: Update plan progress

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: plan-progress-main
  cancel-in-progress: false

jobs:
  update:
    name: Prepare plan progress update
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main

      - name: Resolve automation branch
        id: branch
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main
          remote_branch_sha=$(git ls-remote origin refs/heads/automation/plan-progress | awk 'NR == 1 { print $1 }')
          if test -n "$remote_branch_sha"; then
            git fetch origin "refs/heads/automation/plan-progress:refs/remotes/origin/automation/plan-progress"
            git switch --create automation/plan-progress refs/remotes/origin/automation/plan-progress
            git rebase origin/main
          else
            git switch --create automation/plan-progress origin/main
          fi
          echo "remote_sha=$remote_branch_sha" >> "$GITHUB_OUTPUT"

      - name: Collect merged pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$REPOSITORY/pulls?state=closed&per_page=100&sort=updated&direction=desc" > "$RUNNER_TEMP/closed-prs.json"

      - name: Render README progress
        run: |
          set -euo pipefail
          node tools/plan-progress.mjs --merged-prs "$RUNNER_TEMP/closed-prs.json" --write README.md | tee "$RUNNER_TEMP/progress.json"

      - name: Keep main protected and publish an update PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REMOTE_BRANCH_SHA: ${{ steps.branch.outputs.remote_sha }}
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo 'README progress is already current'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: update plan progress'
          gh auth setup-git
          if test -n "$REMOTE_BRANCH_SHA"; then
            git push --force-with-lease="refs/heads/automation/plan-progress:$REMOTE_BRANCH_SHA" origin HEAD:automation/plan-progress
          else
            git push origin HEAD:automation/plan-progress
          fi

          cat > "$RUNNER_TEMP/progress-pr-body.md" <<'BODY'
          Plan card: none

          This PR is generated by `Update plan progress`.

          It refreshes only the delimited plan-progress section in `README.md` from the queue cards and merged pull requests. The automation branch is excluded from the count, and protected `main` is never pushed directly.
          BODY
          open_pr=$(gh pr list --repo "$REPOSITORY" --state open --head automation/plan-progress --base main --json number --jq '.[0].number // empty')
          if test -n "$open_pr"; then
            gh pr edit "$open_pr" --title 'docs: update plan progress' --body-file "$RUNNER_TEMP/progress-pr-body.md"
            echo "updated PR #$open_pr"
          else
            gh pr create --repo "$REPOSITORY" --base main --head automation/plan-progress --title 'docs: update plan progress' --body-file "$RUNNER_TEMP/progress-pr-body.md"
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
