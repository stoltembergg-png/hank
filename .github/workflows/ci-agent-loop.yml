name: Agent loop tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-loop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run bounded agent loop contract
        run: node tools/security/agent-loop-feature-tests.mjs
