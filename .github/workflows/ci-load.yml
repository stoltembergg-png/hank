name: Load tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: load-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load:
    name: Bounded load contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pinned Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2

      - name: Setup pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      - name: Run bounded load receipt
        env:
          CARGO_NET_OFFLINE: 'true'
        run: node tools/security/load-runner.mjs --out security/reports/load.json

      - name: Verify load contract TAP
        env:
          CARGO_NET_OFFLINE: 'true'
        run: node tools/security/load-feature-tests.mjs

      - name: Upload load artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: load-${{ github.event.pull_request.head.sha || github.sha }}
          path: security/reports/load.json
          if-no-files-found: error
          retention-days: 7
