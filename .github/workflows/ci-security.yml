name: Security regression tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  threat-regression:
    name: Threat regression runner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pinned Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2

      - name: Run threat regression runner
        run: node tools/security/threat-regression.mjs --out security/reports/threat-regression.json

      - name: Run threat regression contract tests
        run: node --test tools/security/threat-regression.spec.mjs

      - name: Upload threat regression artifact
        if: always()
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: threat-regression-${{ github.sha }}
          path: security/reports/threat-regression.json
          if-no-files-found: error
          retention-days: 7

      - name: Require artifact digest
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: tools/ci/require-artifact-digest.sh
