name: CodeQL SAST

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust build dependencies
        if: matrix.language == 'rust'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          find /etc/apt -type f -print0 | while IFS= read -r -d '' source; do
            sudo perl -0pi -e 's/azure\\.archive\\.ubuntu\\.com/archive.ubuntu.com/g' "$source"
          done
          cat <<'APT_SOURCES' | sudo tee /tmp/hank-ubuntu.sources.list >/dev/null
          deb https://archive.ubuntu.com/ubuntu noble main universe multiverse restricted
          deb https://archive.ubuntu.com/ubuntu noble-updates main universe multiverse restricted
          deb https://security.ubuntu.com/ubuntu noble-security main universe multiverse restricted
          APT_SOURCES
          apt_opts=(-o Dir::Etc::sourcelist=/tmp/hank-ubuntu.sources.list -o Dir::Etc::sourceparts=- -o Acquire::ForceIPv4=true -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60)
          timeout 300s sudo apt-get "${apt_opts[@]}" update
          timeout 900s sudo apt-get "${apt_opts[@]}" -o DPkg::Lock::Timeout=60 -o Dpkg::Use-Pty=0 install --no-install-recommends -y \
            build-essential \
            pkg-config \
            libssl-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild Rust
        if: matrix.language == 'rust'
        uses: github/codeql-action/autobuild@f3712979fa5f215279b101dd0a2e3bdfb4353324

      - name: Analyze CodeQL results
        uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324
        with:
          category: /language:${{ matrix.language }}
