name: Release dry-run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: Release dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run release fixtures
        run: node --test tools/release-dry-run.spec.mjs

      - name: Generate manifest
        run: node tools/release-dry-run.mjs --version v0.0.0-canary --output /tmp/release-manifest.json

      - name: Verify manifest is stop-before-publish
        run: |
          node -e "const m=require('/tmp/release-manifest.json'); if(m.publish || m.sign || !m.stopBeforePublish) process.exit(1)"

      - name: Record manifest digest
        run: sha256sum /tmp/release-manifest.json

      - name: Upload dry-run manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-dry-run-manifest-${{ github.sha }}
          path: /tmp/release-manifest.json
          if-no-files-found: error
          retention-days: 7
