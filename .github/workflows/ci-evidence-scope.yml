name: Contract evidence scope

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-scope-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-scope:
    name: Contract scope and visual evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pinned Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2

      - name: Verify contract evidence scope
        run: |
          set -o pipefail
          mkdir -p security/reports
          node tools/security/evidence-scope-feature-tests.mjs 2>&1 | tee security/reports/evidence-scope.tap

      - name: Generate visual contract evidence
        run: node tools/security/generate-evidence-scope-report.mjs

      - name: Require exact source identity
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Publish evidence summary
        if: always()
        run: |
          {
            echo "## Contract evidence scope"
            echo ""
            echo "> **NOT PRODUCTION PROOF** — this check validates offline contracts only."
            echo ""
            echo "- The SVG/HTML report is generated from the actual TAP result and exact commit/tree."
            echo "- PR-261: synthetic bounded fuzz harness; production parser fuzzing is **NO_PROOF**."
            echo "- PR-266: ephemeral synthetic signing fixtures; real release signing/publication is **NO_PROOF**."
            echo "- PR-267: all platforms remain contract-only; native installer execution is **NO_PROOF**."
            echo "- Visual artifact: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload contract visual evidence
        if: always()
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidence-scope-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            security/reports/evidence-scope.json
            security/reports/evidence-scope.tap
            security/reports/evidence-scope.svg
            security/reports/evidence-scope.html
          if-no-files-found: error
          retention-days: 7

      - name: Require evidence artifact digest
        if: steps.upload.outputs.artifact-digest != ''
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: tools/ci/require-artifact-digest.sh
