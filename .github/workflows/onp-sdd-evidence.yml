        run: node tools/ci/run-onp-spec.mjs verify workflow-parallel-node

      - name: Verify automation UI
        run: node tools/ci/run-onp-spec.mjs verify automation-ui

      - name: Verify project desktop bridge
        env:
          HANK_SKIP_TAURI: ''
        run: node tools/ci/run-onp-spec.mjs verify project-desktop-bridge

      - name: Verify json-rpc transport
        run: node tools/ci/run-onp-spec.mjs verify json-rpc-transport

      - name: Verify CI build
        run: node tools/ci/run-onp-spec.mjs verify ci-build

      - name: Verify W0 contract closure
        run: node tools/ci/run-onp-spec.mjs verify w0-contract-closure

      - name: Run aggregate non-native coverage diagnostic
        run: node tools/run-all-tests.mjs

      - name: Verify Tauri desktop
        env:
          HANK_SKIP_TAURI: ''
          HANK_ONLY_TAURI: '1'
        run: |
          set -o pipefail
          node tools/ci/run-onp-spec.mjs verify tauri-desktop 2>&1 | tee .spec/tauri-desktop-onp.log

      - name: Audit SDD
        run: node tools/ci/run-onp-spec.mjs audit --ci

      - name: Upload ONP evidence
        if: always()
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: onp-evidence-${{ github.sha }}
          path: |
            .spec/verification/*.json
            .spec/tauri-desktop-onp.log
          if-no-files-found: error
          retention-days: 7

      - name: Require evidence artifact digest
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: tools/ci/require-artifact-digest.sh
