name: ONP SDD evidence

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onp-sdd-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ONP SDD verify and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HANK_SKIP_TAURI: '1'
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pinned Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.2

      - name: Install Rust and Tauri dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          cat <<'APT_SOURCES' | sudo tee /tmp/hank-ubuntu.sources.list >/dev/null
          deb https://mirrors.edge.kernel.org/ubuntu noble main universe multiverse restricted
          deb https://mirrors.edge.kernel.org/ubuntu noble-updates main universe multiverse restricted
          deb https://mirrors.edge.kernel.org/ubuntu noble-security main universe multiverse restricted
          APT_SOURCES
          apt_opts=(-o Dir::Etc::sourcelist=/tmp/hank-ubuntu.sources.list -o Dir::Etc::sourceparts=- -o Acquire::ForceIPv4=true -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60)
          timeout 300s sudo apt-get "${apt_opts[@]}" update
          timeout 900s sudo apt-get "${apt_opts[@]}" -o DPkg::Lock::Timeout=60 -o Dpkg::Use-Pty=0 install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
          pkg-config --modversion javascriptcoregtk-4.1
          pkg-config --modversion webkit2gtk-4.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-fund

      - name: Warm up full suite with visible output
        run: node tools/run-all-tests.mjs

      - name: Diagnose worker process stability under repetition
        run: |
          for i in $(seq 1 50); do
            echo "=== worker process run $i ==="
            cargo test -p agent-protocol --test worker_process_contract --locked || {
              echo "DIAGNOSTIC FAILED ON RUN $i";
              exit 1;
            }
          done

      - name: Verify foundation workspace
        run: node tools/ci/run-onp-spec.mjs verify foundation-workspace

      - name: Verify tools core
        run: node tools/ci/run-onp-spec.mjs verify tools-core

      - name: Verify release prereleases
        run: node tools/ci/run-onp-spec.mjs verify release-prereleases

      - name: Verify permission evaluator
        run: node tools/ci/run-onp-spec.mjs verify permission-evaluator

      - name: Verify filesystem read
        run: node tools/ci/run-onp-spec.mjs verify filesystem-read

      - name: Verify filesystem write
        run: node tools/ci/run-onp-spec.mjs verify filesystem-write

      - name: Verify directory list
        run: node tools/ci/run-onp-spec.mjs verify directory-list

      - name: Verify process primitive
        run: node tools/ci/run-onp-spec.mjs verify process-primitive

      - name: Verify terminal adapter
        run: node tools/ci/run-onp-spec.mjs verify terminal-adapter

      - name: Verify HTTP tool
        run: node tools/ci/run-onp-spec.mjs verify http-tool

      - name: Verify Git status
        run: node tools/ci/run-onp-spec.mjs verify git-status

      - name: Verify Git diff
        run: node tools/ci/run-onp-spec.mjs verify git-diff

      - name: Verify Git commit
        run: node tools/ci/run-onp-spec.mjs verify git-commit

      - name: Verify frontend workspace
        run: node tools/ci/run-onp-spec.mjs verify frontend-workspace

      - name: Verify skill UI
        run: node tools/ci/run-onp-spec.mjs verify skill-ui

      - name: Verify skill editor
        run: node tools/ci/run-onp-spec.mjs verify skill-editor

      - name: Verify skill test framework
        run: node tools/ci/run-onp-spec.mjs verify skill-test-framework

      - name: Verify skill validation
        run: node tools/ci/run-onp-spec.mjs verify skill-validation

      - name: Verify skill creation
        run: node tools/ci/run-onp-spec.mjs verify skill-creation

      - name: Verify skill evaluation
