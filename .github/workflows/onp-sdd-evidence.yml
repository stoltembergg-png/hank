name: ONP SDD evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onp-sdd-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ONP SDD verify and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup pinned Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20.19.1

      - name: Install Rust and Tauri dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          find /etc/apt -type f -print0 | while IFS= read -r -d '' source; do
            sudo perl -0pi -e 's/azure\\.archive\\.ubuntu\\.com/archive.ubuntu.com/g' "$source"
          done
          cat <<'APT_SOURCES' | sudo tee /tmp/hank-ubuntu.sources.list >/dev/null
          deb https://archive.ubuntu.com/ubuntu noble main universe multiverse restricted
          deb https://archive.ubuntu.com/ubuntu noble-updates main universe multiverse restricted
          deb https://security.ubuntu.com/ubuntu noble-security main universe multiverse restricted
          APT_SOURCES
          apt_opts=(-o Dir::Etc::sourcelist=/tmp/hank-ubuntu.sources.list -o Dir::Etc::sourceparts=- -o Acquire::ForceIPv4=true -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60)
          timeout 300s sudo apt-get "${apt_opts[@]}" update
          timeout 900s sudo apt-get "${apt_opts[@]}" -o DPkg::Lock::Timeout=60 -o Dpkg::Use-Pty=0 install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
          pkg-config --modversion javascriptcoregtk-4.1
          pkg-config --modversion webkit2gtk-4.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-fund

      - name: Verify foundation workspace
        run: node tools/ci/run-onp-spec.mjs verify foundation-workspace

      - name: Verify tools core
        run: node tools/ci/run-onp-spec.mjs verify tools-core

      - name: Verify frontend workspace
        run: node tools/ci/run-onp-spec.mjs verify frontend-workspace

      - name: Verify CI build
        run: node tools/ci/run-onp-spec.mjs verify ci-build

      - name: Verify W0 contract closure
        run: node tools/ci/run-onp-spec.mjs verify w0-contract-closure

      - name: Verify Tauri desktop
        run: node tools/ci/run-onp-spec.mjs verify tauri-desktop

      - name: Audit SDD
        run: node tools/ci/run-onp-spec.mjs audit --ci

      - name: Upload ONP evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: onp-evidence-${{ github.sha }}
          path: .spec/verification/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Require evidence artifact digest
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: tools/ci/require-artifact-digest.sh
