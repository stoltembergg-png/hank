      - name: Verify planning evidence binding
        run: node tools/ci/run-onp-spec.mjs verify planning-evidence-binding

      - name: Verify planning adversarial E2E
        run: node tools/ci/run-onp-spec.mjs verify planning-adversarial-e2e

      - name: Verify native evaluation contract
        run: node tools/ci/run-onp-spec.mjs verify native-evaluation-contract

      - name: Verify native evaluation corpus
        run: node tools/ci/run-onp-spec.mjs verify native-evaluation-corpus

      - name: Verify native evaluation runner
        run: node tools/ci/run-onp-spec.mjs verify native-evaluation-runner

      - name: Verify benchmark comparison
        run: node tools/ci/run-onp-spec.mjs verify benchmark-comparison

      - name: Verify safety and reasoning evaluation corpus
        run: node tools/ci/run-onp-spec.mjs verify safety-reasoning-evaluation-corpus

      - name: Verify agent configuration proposal
        run: node tools/ci/run-onp-spec.mjs verify agent-configuration-proposal

      - name: Verify automated evaluation
        run: node tools/ci/run-onp-spec.mjs verify automated-evaluation

      - name: Verify regression evaluation
        run: node tools/ci/run-onp-spec.mjs verify regression-evaluation

      - name: Verify improvement scoring
        run: node tools/ci/run-onp-spec.mjs verify improvement-scoring

      - name: Verify automatic rollback
        run: node tools/ci/run-onp-spec.mjs verify automatic-rollback

      - name: Verify automatic skill rollout
