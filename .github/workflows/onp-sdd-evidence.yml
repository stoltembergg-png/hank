        run: node tools/ci/run-onp-spec.mjs verify workflow-run-viewer

      - name: Verify workflow editor
        run: node tools/ci/run-onp-spec.mjs verify workflow-editor

      - name: Verify interval scheduling
        run: node tools/ci/run-onp-spec.mjs verify interval-scheduling

