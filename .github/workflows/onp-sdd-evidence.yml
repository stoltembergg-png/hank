      - name: Verify MCP settings UI
        run: node tools/ci/run-onp-spec.mjs verify mcp-settings-ui

      - name: Verify plugin manifest
        run: node tools/ci/run-onp-spec.mjs verify plugin-manifest

      - name: Verify plugin discovery
        run: node tools/ci/run-onp-spec.mjs verify plugin-discovery

      - name: Verify plugin lifecycle
        run: node tools/ci/run-onp-spec.mjs verify plugin-lifecycle

      - name: Verify plugin permissions
        run: node tools/ci/run-onp-spec.mjs verify plugin-permissions

      - name: Verify provider plugins
        run: node tools/ci/run-onp-spec.mjs verify provider-plugins

      - name: Verify tool plugins
        run: node tools/ci/run-onp-spec.mjs verify tool-plugins

      - name: Verify runtime transport
        run: node tools/ci/run-onp-spec.mjs verify runtime-transport

      - name: Verify remote protocol
        run: node tools/ci/run-onp-spec.mjs verify remote-protocol

      - name: Verify authenticated remote daemon
        run: node tools/ci/run-onp-spec.mjs verify authenticated-remote-daemon

      - name: Verify remote credential isolation
        run: node tools/ci/run-onp-spec.mjs verify remote-credential-isolation

      - name: Verify node management UI
        run: node tools/ci/run-onp-spec.mjs verify node-management-ui

      - name: Verify crash recovery contract
        run: node tools/ci/run-onp-spec.mjs verify crash-recovery-contract

      - name: Verify database backups
        run: node tools/ci/run-onp-spec.mjs verify database-backups

      - name: Verify backup restore
        run: node tools/ci/run-onp-spec.mjs verify backup-restore

      - name: Verify migration hardening
        run: node tools/ci/run-onp-spec.mjs verify migration-hardening

      - name: Verify secret migration
        run: node tools/ci/run-onp-spec.mjs verify secret-migration

      - name: Verify websocket event stream
        run: node tools/ci/run-onp-spec.mjs verify websocket-event-stream

      - name: Verify workflow AgentNode
        run: node tools/ci/run-onp-spec.mjs verify workflow-agent-node

      - name: Verify workflow ToolNode
        run: node tools/ci/run-onp-spec.mjs verify workflow-tool-node

      - name: Verify workflow PythonNode
        run: node tools/ci/run-onp-spec.mjs verify workflow-python-node

